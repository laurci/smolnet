[package]
name = "smolmesh"
version = "0.1.0"
edition = "2024"

[dependencies]
libc = "0.2"
rand = "0.10.2"
smolnet = { path = ".." }
thiserror = "2.0.20"
tokio = { version = "1", features = ["net", "rt", "sync", "time", "macros"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "io-util"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
