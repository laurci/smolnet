syntax = "proto3";

package smolctl.v1;

service Control {
  rpc Session(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  oneof body {
    Endpoints endpoints = 1;
    Heartbeat heartbeat = 2;
    Hello hello = 3;
  }
}

message Endpoints {
  repeated string candidates = 1;
}

message Heartbeat {}

message Hello {
  string hostname = 1;
  string os = 2;
  string version = 3;
  // hex encoded x25519 static public key for the noise session
  string public_key = 4;
}

message ServerMessage {
  oneof body {
    Welcome welcome = 1;
    PeerState peer = 2;
    PeerGone gone = 3;
  }
}

message Welcome {
  string network = 1;
  string node = 2;
  string ip = 3;
  string device = 7;
  string hostname = 8;
  string name = 9;
  string zone = 10;
  string netmask = 4;
  string reflector = 5;
  repeated PeerState peers = 6;
}

message PeerState {
  string node = 1;
  string ip = 2;
  repeated string endpoints = 3;
  bool online = 4;
  string public_key = 5;
  // the device's unique name; <name>.smol resolves to its overlay address
  string name = 6;
}

message PeerGone {
  string node = 1;
}
