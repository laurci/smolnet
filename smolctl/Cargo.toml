[package]
name = "smolctl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8", features = ["ws", "macros"] }
clap = { version = "4", features = ["derive", "env"] }
libc = "0.2"
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto"] }
prost = "0.14"
rand = "0.10.2"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.6", features = ["fs", "trace"] }
smolmesh = { path = "../smolmesh" }
smolnet = { path = "../smolnet" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util", "io-std"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { version = "0.14", features = ["tls-ring", "tls-webpki-roots"] }
tonic-prost = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rcgen = "0.14.9"

[build-dependencies]
protoc-bin-vendored = "3"
tonic-prost-build = "0.14"

[[bin]]
name = "smolctl"
path = "src/bin/smolctl.rs"
